name: Package CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_carla:
        description: Run live tests on the configured self-hosted UE5.8 runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10", mujoco: "mujoco==3.6.0"}
          - {os: ubuntu-latest, python: "3.14", mujoco: "mujoco>=3.6"}
          - {os: windows-latest, python: "3.13", mujoco: "mujoco>=3.6"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: MyoHub/myosuite
          ref: dev
          path: myosuite
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install MyoSuite dev and standalone bridge
        run: python -m pip install -e ./myosuite -e "./bridge[test,lint]" "${{ matrix.mujoco }}"
      - name: Record dependency versions
        working-directory: bridge
        run: python -m pip freeze
      - name: Test CPU physics and bridge contracts
        working-directory: bridge
        run: python -m pytest tests --cov=myosuite_carla --cov-report=xml -q
      - name: Lint
        working-directory: bridge
        run: python -m ruff check src tests examples benchmarks
      - name: Check formatting
        working-directory: bridge
        run: python -m ruff format --check src tests examples benchmarks
      - name: Check package types
        working-directory: bridge
        run: python -m mypy src/myosuite_carla --ignore-missing-imports --follow-imports=skip
      - name: Build distributions
        working-directory: bridge
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.python }}
          path: |
            bridge/dist/*
            bridge/coverage.xml

  embodied-human:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: MyoHub/myosuite
          ref: dev
          path: myosuite
      - uses: actions/checkout@v4
        with:
          repository: M-Colley/embodied-ui
          ref: 605862bd551401bfce91afb4afcf280b2bef98fd
          path: embodied-ui
      - uses: actions/checkout@v4
        with:
          repository: M-Colley/embodied-human
          ref: 770b358e38b8e4eae966d1f106b3e071e58fce1a
          path: embodied-human
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integrated CPU dependencies
        run: python -m pip install -e ./myosuite -e ./embodied-ui -e ./embodied-human -e "./bridge[test,analysis,rl]"
      - name: Record dependency versions
        run: |
          python -m pip freeze
          git -C myosuite rev-parse HEAD
          git -C embodied-ui rev-parse HEAD
          git -C embodied-human rev-parse HEAD
      - name: Test bridge with optional interfaces and training
        working-directory: bridge
        run: python -m pytest tests -q --junitxml=test-results/integration-bridge.xml
      - name: Test embodied human driving integration
        working-directory: bridge
        run: python -m pytest ../embodied-human/tests/test_driving.py ../embodied-human/tests/test_body_sensing.py -q --junitxml=test-results/integration-human.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embodied-human-integration
          path: bridge/test-results/integration-*.xml

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_carla
    runs-on: [self-hosted, carla-ue58]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone bridge
        run: python -m pip install -e ".[test]"
      - name: Test real server
        env:
          CARLA_BRIDGE_LIVE: "1"
          CARLA_LIVE_OUTPUT: artifacts/carla-live.json
          CARLA_SESSION_OUTPUT: artifacts/carla-session.json
        run: python -m pytest tests/test_live_server.py tests/test_live_session.py -v --junitxml=live-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-carla-results
          path: |
            live-results.xml
            artifacts/carla-live.json
            artifacts/carla-session.json
