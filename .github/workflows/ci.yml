name: Package CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_carla:
        description: Run live tests on the configured self-hosted CARLA 1.0 runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10", mujoco: "mujoco==3.6.0", myosuite: "3.1.0"}
          - {os: ubuntu-latest, python: "3.10", mujoco: "mujoco==3.6.0", myosuite: dev}
          - {os: ubuntu-latest, python: "3.14", mujoco: "mujoco>=3.6,<4", myosuite: "3.1.0"}
          - {os: ubuntu-latest, python: "3.14", mujoco: "mujoco>=3.6,<4", myosuite: dev}
          - {os: windows-latest, python: "3.13", mujoco: "mujoco>=3.6,<4", myosuite: "3.1.0"}
          - {os: windows-latest, python: "3.13", mujoco: "mujoco>=3.6,<4", myosuite: dev}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        if: matrix.myosuite == 'dev'
        with:
          repository: MyoHub/myosuite
          ref: dev
          path: myosuite
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install MyoSuite 3.1 release and standalone bridge
        if: matrix.myosuite == '3.1.0'
        run: python -m pip install -c bridge/constraints/myosuite-3.1.txt "myosuite==3.1.0" -e "./bridge[myosuite,test,lint]" "${{ matrix.mujoco }}"
      - name: Install MyoSuite dev and standalone bridge
        if: matrix.myosuite == 'dev'
        run: python -m pip install -c bridge/constraints/myosuite-3.1.txt -e ./myosuite -e "./bridge[myosuite,test,lint]" "${{ matrix.mujoco }}"
      - name: Check imported physics runtime and model builder
        run: >-
          python -c "import importlib.metadata as m, mujoco;
          from myosuite.core.model_builder import ModelBuilder;
          print('myosuite', m.version('myosuite'), 'myo-sim', m.version('myo-sim'), 'mujoco', m.version('mujoco'), 'runtime', mujoco.__version__);
          assert m.version('mujoco') == mujoco.__version__;
          assert not any(d.metadata['Name'].lower().replace('_', '-') == 'mujoco-core' for d in m.distributions())"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Record MyoSuite dev revision
        if: matrix.myosuite == 'dev'
        run: git -C myosuite rev-parse HEAD
      - name: Record dependency versions
        working-directory: bridge
        run: python -m pip freeze
      - name: Test CPU physics and bridge contracts
        working-directory: bridge
        run: python -m pytest tests --cov=myosuite_carla --cov-report=xml -q
      - name: Lint
        working-directory: bridge
        run: python -m ruff check src tests examples benchmarks
      - name: Check formatting
        working-directory: bridge
        run: python -m ruff format --check src tests examples benchmarks
      - name: Check package types
        working-directory: bridge
        run: python -m mypy src/myosuite_carla --ignore-missing-imports --follow-imports=skip
      - name: Build distributions
        working-directory: bridge
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.python }}-myosuite-${{ matrix.myosuite }}
          path: |
            bridge/dist/*
            bridge/coverage.xml

  revised-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned development models
        run: >-
          python -m pip install -c constraints/myosuite-3.1.txt
          "mujoco==3.17.0"
          "myosuite @ git+https://github.com/MyoHub/myosuite.git@fc0892c9c3a82163c4219dc9c5b6ba76ffd0fd04"
          "myo-sim @ git+https://github.com/fl0fischer/myo_sim.git@dd8663bbd5af22dc49c6c38b958e0288eaeafde5"
          -e ".[myosuite,test]"
      - name: Verify native physics dependencies
        run: |
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          import mujoco
          import myo_sim
          from myosuite.core.model_builder import ModelBuilder

          assert mujoco.mj_versionString() == version("mujoco") == "3.17.0"
          model = myo_sim.load_spec("myofullbody").compile()
          assert model.joint("node_LUM1_r").id >= 0
          assert model.actuator("BIClong_r").id >= 0
          PY
      - name: Record dependency versions and test native driving
        run: |
          python -m pip freeze
          python -m pytest tests/test_model_compatibility.py tests/test_fullbody.py tests/test_conditions.py tests/test_driving_env.py -q --junitxml=test-results/revised-model.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revised-model-tests
          path: test-results/revised-model.xml

  embodied-human:
    strategy:
      fail-fast: false
      matrix:
        myosuite: ["3.1.0", dev]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        if: matrix.myosuite == 'dev'
        with:
          repository: MyoHub/myosuite
          ref: dev
          path: myosuite
      - uses: actions/checkout@v4
        with:
          repository: M-Colley/embodied-ui
          ref: 605862bd551401bfce91afb4afcf280b2bef98fd
          path: embodied-ui
      - uses: actions/checkout@v4
        with:
          repository: M-Colley/embodied-human
          ref: e938e90b7d38638fe2c588e5e7f7a6621e41eec2
          path: embodied-human
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integrated CPU dependencies with MyoSuite 3.1
        if: matrix.myosuite == '3.1.0'
        run: python -m pip install -c bridge/constraints/myosuite-3.1.txt "myosuite==3.1.0" -e ./embodied-ui -e "./embodied-human[empirical]" -e "./bridge[myosuite,test,analysis,rl]"
      - name: Install integrated CPU dependencies with MyoSuite dev
        if: matrix.myosuite == 'dev'
        run: python -m pip install -c bridge/constraints/myosuite-3.1.txt -e ./myosuite -e ./embodied-ui -e "./embodied-human[empirical]" -e "./bridge[myosuite,test,analysis,rl]"
      - name: Check imported physics runtime and model builder
        run: >-
          python -c "import importlib.metadata as m, mujoco;
          from myosuite.core.model_builder import ModelBuilder;
          print('myosuite', m.version('myosuite'), 'myo-sim', m.version('myo-sim'), 'mujoco', m.version('mujoco'), 'runtime', mujoco.__version__);
          assert m.version('mujoco') == mujoco.__version__;
          assert not any(d.metadata['Name'].lower().replace('_', '-') == 'mujoco-core' for d in m.distributions())"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Record MyoSuite dev revision
        if: matrix.myosuite == 'dev'
        run: git -C myosuite rev-parse HEAD
      - name: Record dependency versions
        run: |
          python -m pip freeze
          git -C embodied-ui rev-parse HEAD
          git -C embodied-human rev-parse HEAD
      - name: Test bridge with optional interfaces and training
        working-directory: bridge
        run: python -m pytest tests -q --junitxml=test-results/integration-bridge.xml
      - name: Test embodied human driving integration
        working-directory: bridge
        run: >-
          python -m pytest
          ../embodied-human/tests/test_driving.py
          ../embodied-human/tests/test_body_sensing.py
          ../embodied-human/tests/test_driving_campaign.py
          ../embodied-human/tests/test_closed_loop_calibration.py
          ../embodied-human/tests/test_actuation_evaluation.py
          ../embodied-human/tests/test_driving_data.py
          ../embodied-human/tests/test_driving_evaluation.py
          ../embodied-human/tests/test_driving_profiles.py
          ../embodied-human/tests/test_driving_protocols.py
          ../embodied-human/tests/test_fixation_protocol.py
          ../embodied-human/tests/test_fixation_task.py
          -q --junitxml=test-results/integration-human.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embodied-human-integration-myosuite-${{ matrix.myosuite }}
          path: bridge/test-results/integration-*.xml

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_carla
    runs-on: [self-hosted, carla-1.0]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone bridge
        run: python -m pip install -c constraints/myosuite-3.1.txt "myosuite==3.1.0" -e ".[myosuite,test]"
      - name: Check imported physics runtime and model builder
        run: >-
          python -c "import importlib.metadata as m, mujoco;
          from myosuite.core.model_builder import ModelBuilder;
          print('myosuite', m.version('myosuite'), 'myo-sim', m.version('myo-sim'), 'mujoco', m.version('mujoco'), 'runtime', mujoco.__version__);
          assert m.version('mujoco') == mujoco.__version__;
          assert not any(d.metadata['Name'].lower().replace('_', '-') == 'mujoco-core' for d in m.distributions())"
      - name: Test real server
        env:
          CARLA_BRIDGE_LIVE: "1"
          CARLA_TARGET_REF: "1.0"
          CARLA_LIVE_OUTPUT: artifacts/carla-live.json
          CARLA_SESSION_OUTPUT: artifacts/carla-session.json
          CARLA_FULLBODY_OUTPUT: artifacts/carla-fullbody.json
        run: python -m pytest tests/test_live_server.py tests/test_live_session.py tests/test_live_fullbody.py -v --junitxml=live-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-carla-results
          path: |
            live-results.xml
            artifacts/carla-live.json
            artifacts/carla-session.json
            artifacts/carla-fullbody.json
