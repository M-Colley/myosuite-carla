[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myosuite-carla"
version = "0.1.0"
description = "Physical driver controls connecting MyoSuite and CARLA UE5.8"
authors = [{ name = "Mark Colley" }]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "mujoco>=3.6", "gymnasium>=1.0,<1.3"]

[project.urls]
Homepage = "https://github.com/M-Colley/myosuite-carla"
Repository = "https://github.com/M-Colley/myosuite-carla"
Issues = "https://github.com/M-Colley/myosuite-carla/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "build>=1"]
lint = ["mypy>=1.15", "ruff>=0.11"]
# Parquet and MCAP exports (myosuite_carla.recording).
data = ["pandas>=2", "pyarrow>=14", "mcap>=1.2"]
# Vehicle surrogate fitting and human-data comparison.
analysis = ["scipy>=1.10", "scikit-learn>=1.3", "pandas>=2"]
# Policy training with Stable-Baselines3 (training_sb3.py), as in arm_force_driving.
rl = ["stable-baselines3>=2.8,<3", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["carla: requires an explicitly enabled running CARLA UE5.8 server"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["myosuite_carla"]
